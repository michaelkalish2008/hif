[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hif"
version = "0.1.0"
description = "Horizonal Interpretability — a behavioural measurement instrument for language models, in natural units."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Kalish" }]
keywords = ["llm", "interpretability", "entropy", "measurement", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "transformers>=4.45",
    "torch",
    "numpy",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "sentence-transformers",
    "hdbscan",
    "pydantic>=2.0",
    "typer[all]",
    "rich",
    "httpx",
    "plotly",
    "nltk",
    "pillow",
]

[project.optional-dependencies]
tlens = ["transformer_lens"]
ollama = ["httpx>=0.27"]
openai = ["openai>=1.0", "tiktoken"]
anthropic = ["anthropic>=0.25", "tiktoken"]
gemini = ["google-genai>=1.0", "tiktoken"]
api = ["openai>=1.0", "anthropic>=0.25", "google-genai>=1.0", "tiktoken", "python-dotenv"]
accelerate = ["accelerate"]
umap = ["umap-learn"]
calibration = ["datasets>=2.0"]
dev = ["pytest", "pytest-cov", "mypy", "ruff"]

[project.scripts]
hif = "hif.cli:app"

[project.urls]
Homepage = "https://github.com/michaelkalish2008/hif"
Source = "https://github.com/michaelkalish2008/hif"

[tool.hatch.build.targets.wheel]
packages = ["hif"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/unit"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "integration: marks tests as integration tests (deselect with -m 'not integration')",
    "tlens: marks tests requiring TransformerLens",
    "ollama: marks tests requiring a local Ollama server",
]
